<style>

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {

.wrap { max-width: 660px; margin: 0 auto; padding: 24px 16px 60px; }

.logo-svg { flex-shrink: 0; }
.header-div { width: 1px; height: 20px; background: var(--border); margin-left: 4px; }
.header-label { font-size: 11px; font-weight: 700; letter-spacing: .1em; color: var(--teal); text-transform: uppercase; opacity: .85; }

.screen { display: none; }
.screen.active { display: block; animation: fadeUp .4s ease; }

.start-sub { color: var(--muted); font-size: 14px; line-height: 1.85; margin-bottom: 26px; }

.btn-start { display:inline-flex; align-items:center; gap:10px; background:linear-gradient(135deg,var(--teal),#2d8fa3); color:#fff; border:none; border-radius:14px; padding:16px 32px; font-size:16px; font-family:inherit; font-weight:700; cursor:pointer; box-shadow:0 4px 24px rgba(56,164,187,.35); transition:transform .15s,box-shadow .15s; }

.prog-fill { height:100%; background:linear-gradient(90deg,var(--teal),var(--yellow)); border-radius:4px; transition:width .4s; }

.q-card { background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:26px; margin-bottom:14px; }
.q-num { font-size:11px; font-weight:900; color:var(--teal); letter-spacing:.2em; text-transform:uppercase; margin-bottom:10px; }
.q-text { font-size:17px; font-weight:700; line-height:1.65; }
.options { display:flex; flex-direction:column; gap:10px; }
.opt-btn { background:var(--surface); border:1.5px solid var(--border); border-radius:14px; padding:15px 17px; text-align:left; color:var(--text); font-family:inherit; font-size:14px; cursor:pointer; display:flex; align-items:center; gap:13px; line-height:1.55; transition:all .15s; }

.opt-icon { width:33px; height:33px; min-width:33px; background:rgba(255,255,255,.05); border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }

.res-type-badge { display:inline-block; padding:5px 16px; border-radius:20px; font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; margin-bottom:12px; }
.res-emoji { font-size:52px; display:block; margin-bottom:10px; }
.res-name { font-size:26px; font-weight:900; margin-bottom:10px; }

.bar-label strong { color:var(--text); }
.bar-track { height:8px; background:var(--bg); border-radius:4px; overflow:hidden; }
.bar-fill { height:100%; border-radius:4px; width:0; transition:width 1s cubic-bezier(.4,0,.2,1); }
.jobs-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.job-card { background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); border-radius:12px; padding:13px 14px; }
.job-icon { font-size:20px; margin-bottom:5px; }
.job-name { font-size:13px; font-weight:700; margin-bottom:3px; color:#f3f4f6; }
.job-desc { font-size:11px; color:var(--subtle); line-height:1.5; }
.advice-list { list-style:none; display:flex; flex-direction:column; gap:10px; }
.advice-item { display:flex; align-items:flex-start; gap:11px; font-size:13px; color:var(--muted); line-height:1.7; }
.advice-check { width:22px; height:22px; min-width:22px; background:rgba(67,233,123,.15); border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:11px; color:#43e97b; margin-top:2px; }

.btn-url { background:linear-gradient(135deg,var(--teal),#2d8fa3); color:#fff; border:none; border-radius:14px; padding:14px 12px; font-family:inherit; font-size:14px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; transition:all .2s; box-shadow:0 4px 18px rgba(56,164,187,.3); }

/* MOBILE */

</style>
</head>

let cur = 0, scores = {social:0,creative:0,analytical:0,leadership:0}, currentResult = null;

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
}

function startTest() {
  cur = 0; scores = {social:0,creative:0,analytical:0,leadership:0};
  const url = new URL(location.href); url.searchParams.delete('result');
  history.replaceState({}, '', url);
  renderQ(); show('screen-question');
}

function renderQ() {
  const q = questions[cur];
  document.getElementById('prog-counter').textContent = `Q ${cur+1} / ${questions.length}`;
  document.getElementById('prog-cat').textContent = q.cat;
  document.getElementById('q-num').textContent = `QUESTION ${String(cur+1).padStart(2,'0')}`;
  document.getElementById('q-text').textContent = q.text;
  document.getElementById('prog-fill').style.width = `${(cur/questions.length)*100}%`;
  const el = document.getElementById('options');
  el.innerHTML = q.opts.map((o,i) => `
    <button class="opt-btn" onclick="pick(${i})">
      <div class="opt-icon">${o.e}</div>
      <span>${o.l}</span>
    </button>`).join('');
}

function pick(i) {
  const s = questions[cur].opts[i].s;
  Object.keys(s).forEach(k => scores[k] += s[k]);
  cur++;
  if (cur >= questions.length) {
    const top = Object.entries(scores).sort((a,b)=>b[1]-a[1])[0][0];
    showResult(RESULTS[top]);
    const url = new URL(location.href); url.searchParams.set('result', top);
    history.replaceState({}, '', url);
  } else { renderQ(); }
}

function showResult(r) {
  currentResult = r;
  // Hero
  const badge = document.getElementById('res-badge');
  badge.textContent = r.type;
  badge.style.background = r.color+'22';
  badge.style.border = `1px solid ${r.color}`;
  badge.style.color = r.color;
  document.getElementById('res-emoji').textContent = r.emoji;
  const nm = document.getElementById('res-name');
  nm.textContent = r.name;
  nm.style.background = `linear-gradient(135deg,#fff,${r.color})`;
  nm.style.webkitBackgroundClip = 'text';
  nm.style.webkitTextFillColor = 'transparent';
  nm.style.backgroundClip = 'text';
  document.getElementById('res-desc').textContent = r.desc;
  // Bars colors
  ['traits-bar','bars-bar','jobs-bar','advice-bar'].forEach(id => {
    document.getElementById(id).style.background = r.color;
  });
  // Traits
  document.getElementById('res-traits').innerHTML = r.traits.map(([e,t])=>`<div class="trait">${e} ${t}</div>`).join('');
  // Bars
  document.getElementById('res-bars').innerHTML = r.bars.map(b=>`
    <div class="bar-row">
      <div class="bar-label"><strong>${b.l}</strong><span>${b.v}%</span></div>
      <div class="bar-track"><div class="bar-fill" data-v="${b.v}" style="background:linear-gradient(90deg,${r.color},${BRAND.yellow})"></div></div>
    </div>`).join('');
  // Jobs
  document.getElementById('res-jobs').innerHTML = r.jobs.map(j=>`
    <div class="job-card"><div class="job-icon">${j.e}</div><div class="job-name">${j.n}</div><div class="job-desc">${j.d}</div></div>`).join('');
  // Advice
  document.getElementById('res-advice').innerHTML = r.advice.map(a=>`
    <li class="advice-item"><div class="advice-check">✓</div><span>${a}</span></li>`).join('');
  show('screen-result');
  setTimeout(()=>{
    document.querySelectorAll('.bar-fill').forEach(el=>{ el.style.width = el.dataset.v+'%'; });
  },200);
}

function restartTest() { startTest(); }

function copyURL() {
  const url = new URL(location.href);
  url.searchParams.set('result', currentResult.key);
  navigator.clipboard.writeText(url.toString()).then(()=>{
    const btn = document.getElementById('btn-url');
    btn.textContent = '✓ コピーしました！';
    btn.classList.add('copied');
    setTimeout(()=>{ btn.innerHTML='🔗 結果URLをコピー'; btn.classList.remove('copied'); }, 2200);
  });
}

function downloadImage() {
  if (!currentResult) return;
  const r = currentResult;
  const canvas = document.createElement('canvas');
  const W=1200,H=630; canvas.width=W; canvas.height=H;
  const ctx = canvas.getContext('2d');
  // BG
  const g=ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#142028'); g.addColorStop(.6,'#1a2e36'); g.addColorStop(1,'#1f3540');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // Top gradient bar
  const tg=ctx.createLinearGradient(0,0,W,0);
  tg.addColorStop(0,BRAND.teal); tg.addColorStop(1,BRAND.yellow);
  ctx.fillStyle=tg; ctx.fillRect(0,0,W,6);
  // Logo blocks
  ctx.fillStyle=BRAND.teal;
  ctx.beginPath(); ctx.roundRect(60,36,42,42,9); ctx.fill();
  ctx.fillStyle=BRAND.yellow;
  ctx.beginPath(); ctx.roundRect(80,28,42,42,9); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 15px system-ui';
  ctx.fillText('OVER',132,50); ctx.fillText('DOOR',132,68);
  ctx.fillStyle=BRAND.teal; ctx.font='12px system-ui';
  ctx.fillText('適職診断',132,86);
  // Separator
  ctx.strokeStyle='rgba(56,164,187,.25)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(60,108); ctx.lineTo(W-60,108); ctx.stroke();
  // Type badge
  ctx.font='bold 13px system-ui';
  const bw=ctx.measureText(r.type).width+32;
  ctx.fillStyle=r.color+'33';
  ctx.beginPath(); ctx.roundRect(60,126,bw,32,16); ctx.fill();
  ctx.strokeStyle=r.color; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.roundRect(60,126,bw,32,16); ctx.stroke();
  ctx.fillStyle=r.color; ctx.fillText(r.type,76,147);
  // Emoji + Name
  ctx.font='76px serif'; ctx.fillText(r.emoji,60,260);
  ctx.font='bold 50px system-ui'; ctx.fillStyle='#fff';
  ctx.fillText(r.name,60,328);
  // Description
  ctx.font='17px system-ui'; ctx.fillStyle='#9ca3af';
  const chars=[...r.desc]; let line='',ly=364,mw=W/2-70;
  for(const ch of chars){
    const t=line+ch;
    if(ctx.measureText(t).width>mw&&line){ctx.fillText(line,60,ly);line=ch;ly+=25;}
    else{line=t;}
    if(ly>440){ctx.fillText(line+'…',60,ly);line=null;break;}
  }
  if(line!=null)ctx.fillText(line,60,ly);
  // Right col
  const rx=W/2+20;
  // Traits
  ctx.fillStyle=r.color; ctx.fillRect(rx,126,3,16);
  ctx.font='bold 12px system-ui'; ctx.fillStyle='#9ca3af';
  ctx.fillText('あなたの強み',rx+12,140);
  let tx=rx,ty=158;
  r.traits.forEach(([e,t])=>{
    const lbl=e+' '+t; ctx.font='13px system-ui';
    const tw=ctx.measureText(lbl).width+22;
    if(tx+tw>W-60){tx=rx;ty+=36;}
    ctx.fillStyle='rgba(56,164,187,.1)';
    ctx.beginPath();ctx.roundRect(tx,ty,tw,26,7);ctx.fill();
    ctx.strokeStyle='rgba(56,164,187,.25)';ctx.lineWidth=1;
    ctx.beginPath();ctx.roundRect(tx,ty,tw,26,7);ctx.stroke();
    ctx.fillStyle='#e5e7eb'; ctx.fillText(lbl,tx+11,ty+18);
    tx+=tw+7;
  });
  // Jobs
  const jy=ty+48;
  ctx.fillStyle=r.color; ctx.fillRect(rx,jy-14,3,16);
  ctx.font='bold 12px system-ui'; ctx.fillStyle='#9ca3af';
  ctx.fillText('おすすめ職種',rx+12,jy);
  r.jobs.forEach((j,i)=>{
    const col=i%2,row=Math.floor(i/2);
    const jx=rx+col*265,jy2=jy+16+row*88;
    ctx.fillStyle='rgba(56,164,187,.07)';
    ctx.beginPath();ctx.roundRect(jx,jy2,252,76,10);ctx.fill();
    ctx.strokeStyle='rgba(56,164,187,.2)';ctx.lineWidth=1;
    ctx.beginPath();ctx.roundRect(jx,jy2,252,76,10);ctx.stroke();
    ctx.font='22px serif'; ctx.fillText(j.e,jx+11,jy2+28);
    ctx.font='bold 14px system-ui'; ctx.fillStyle='#f3f4f6'; ctx.fillText(j.n,jx+44,jy2+24);
    ctx.font='12px system-ui'; ctx.fillStyle='#6b7280'; ctx.fillText(j.d,jx+44,jy2+46);
  });
  // Footer strip
  ctx.fillStyle='rgba(56,164,187,.15)'; ctx.fillRect(0,H-48,W,48);
  ctx.font='13px system-ui'; ctx.fillStyle=BRAND.teal;
  ctx.fillText('"働く"の可能性を、もっと楽しく　|　OVERDOOR 適職診断',60,H-16);
  const a=document.createElement('a');
  a.download=`OVERDOOR_適職診断_${r.name}.png`;
  a.href=canvas.toDataURL('image/png'); a.click();
}

// URL param on load
(function(){
  const p=new URLSearchParams(location.search).get('result');
  if(p&&RESULTS[p]){showResult(RESULTS[p]);}
})();
