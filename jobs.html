<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>求人一覧｜OVER DOOR</title>
<style>
:root{--teal:#38A4BB;--yellow:#E0D224;--dark:#253F48;--border:#DCE5E9}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;color:var(--dark);background:#eef3f5}
.bar{background:var(--dark);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.lg{display:flex;align-items:center;gap:10px}
.mark{position:relative;width:34px;height:34px}
.sq{position:absolute;border-radius:8px}
.sq.t{width:27px;height:27px;left:0;top:0;background:var(--teal)}
.sq.y{width:17px;height:17px;left:9px;top:14px;background:var(--yellow)}
.wm{font-weight:900;letter-spacing:4px;font-size:15px}
.wm .y{color:var(--yellow)}
.bar .sub{font-size:12px;opacity:.85}
.wrap{max-width:900px;margin:0 auto;padding:22px 14px 60px}
h1{font-size:17px;font-weight:900;border-left:6px solid var(--teal);border-bottom:3px solid var(--yellow);padding:2px 0 8px 12px;margin-bottom:16px}
.search{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:10px 14px;font-size:14px;margin-bottom:16px;background:#fff}
.card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:12px;box-shadow:0 1px 4px rgba(37,63,72,.06)}
.co{display:flex;align-items:center;gap:8px;color:var(--teal);font-weight:800;font-size:13px}
.co::before{content:"";width:11px;height:11px;border-radius:3px;background:var(--yellow);display:inline-block;flex:none}
.ti{font-size:16px;font-weight:900;margin:4px 0 8px}
.meta{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:12px;color:#5c7681}
.sal{background:var(--teal);color:#fff;border-radius:4px;padding:2px 10px;font-weight:800;font-size:12px}
.acts{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:none;border-radius:6px;padding:8px 16px;font-weight:800;font-size:12.5px;cursor:pointer;text-decoration:none;display:inline-block}
.open{background:var(--teal);color:#fff}
.copy{background:#e7eef1;color:#41626e}
.empty{color:#5c7681;font-size:13px;background:#fff;border:1px dashed var(--border);border-radius:10px;padding:30px;text-align:center;line-height:2}
.err{color:#a33;font-size:13px;padding:20px;text-align:center}
.cnt{font-size:12px;color:#5c7681;margin-bottom:10px}
</style>
</head>
<body>
<div class="bar">
  <div class="lg"><div class="mark"><span class="sq t"></span><span class="sq y"></span></div>
  <div><div class="wm">OVER <span class="y">DOOR</span></div></div></div>
  <div class="sub">公開中の求人一覧　“働く”の可能性を、もっと楽しく</div>
</div>
<div class="wrap">
  <h1>求人一覧</h1>
  <input class="search" id="q" placeholder="🔍 会社名・ポジション名で検索" oninput="render()">
  <div class="cnt" id="cnt"></div>
  <div id="list"></div>
</div>
<script>
let DATA = [];
const esc = s => (s||"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(){
  const q = (document.getElementById("q").value||"").toLowerCase();
  const hits = DATA.filter(j => (j.company+" "+j.title).toLowerCase().includes(q));
  document.getElementById("cnt").textContent = `${hits.length}件 / 全${DATA.length}件`;
  const list = document.getElementById("list");
  if(!hits.length){
    list.innerHTML = `<div class="empty">${DATA.length ? "検索条件に一致する求人がありません" : "まだ公開された求人がありません。<br>求人票メーカーの「🌐 候補者用URL発行」から公開できます。"}</div>`;
    return;
  }
  list.innerHTML = hits.map(j=>{
    const url = j.slug + ".html";
    const full = location.origin + location.pathname.replace(/jobs\.html$/,"") + url;
    return `<div class="card">
      <div class="co">${esc(j.company)||"（会社名未設定）"}</div>
      <div class="ti">${esc(j.title)||"（ポジション名未設定）"}</div>
      <div class="meta">${j.salary?`<span class="sal">想定年収 ${esc(j.salary)}</span>`:""}<span>公開日: ${esc(j.date)}</span></div>
      <div class="acts">
        <a class="btn open" href="${url}" target="_blank" rel="noopener">求人票を見る</a>
        <button class="btn copy" onclick="navigator.clipboard.writeText('${full}').then(()=>{this.textContent='コピーしました！';setTimeout(()=>this.textContent='候補者用URLをコピー',1500)})">候補者用URLをコピー</button>
      </div></div>`;
  }).join("");
}
fetch("jobs.json?t="+Date.now())
  .then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(d=>{ DATA = d.jobs||[]; render(); })
  .catch(e=>{ document.getElementById("list").innerHTML = `<div class="err">一覧を読み込めませんでした。時間をおいて再読み込みしてください。</div>`; });
</script>
</body>
</html>
