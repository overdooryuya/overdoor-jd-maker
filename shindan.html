<style>
:root{--teal:#38A4BB;--yellow:#E0D224;--dark:#253F48;--bg:#142028;--bg2:#1a2e36;--surface:rgba(56,164,187,.06);--border:rgba(56,164,187,.25);--text:#f3f4f6;--muted:#9ca3af;--subtle:#6b7280;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:linear-gradient(160deg,var(--bg) 0%,var(--bg2) 60%,#1f3540 100%);min-height:100vh;font-family:'Noto Sans JP','Hiragino Sans',sans-serif;color:var(--text);}
.wrap{max-width:680px;margin:0 auto;padding:24px 16px 60px;}
.header{display:flex;align-items:center;gap:12px;margin-bottom:28px;}
.header-div{width:1px;height:20px;background:var(--border);margin-left:4px;}
.header-label{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--teal);text-transform:uppercase;opacity:.85;}
.screen{display:none;}
.screen.active{display:block;animation:fadeUp .4s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}

/* START */
.start-title{font-size:clamp(26px,7vw,42px);font-weight:900;line-height:1.15;margin-bottom:14px;background:linear-gradient(135deg,#fff 30%,var(--teal));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.start-sub{color:var(--muted);font-size:14px;line-height:1.85;margin-bottom:26px;}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:30px;}
.badge{background:rgba(56,164,187,.07);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;}
.btn-start{display:inline-flex;align-items:center;gap:10px;background:linear-gradient(135deg,var(--teal),#2d8fa3);color:#fff;border:none;border-radius:14px;padding:16px 32px;font-size:16px;font-family:inherit;font-weight:700;cursor:pointer;box-shadow:0 4px 24px rgba(56,164,187,.35);transition:transform .15s,box-shadow .15s;}
.btn-start:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(56,164,187,.45);}

/* PHASE INDICATOR */
.phase-bar{display:flex;gap:8px;margin-bottom:20px;align-items:center;}
.phase-dot{width:8px;height:8px;border-radius:50%;background:var(--bg);border:1.5px solid var(--border);transition:all .3s;}
.phase-dot.done{background:var(--teal);border-color:var(--teal);}
.phase-dot.active{background:var(--yellow);border-color:var(--yellow);transform:scale(1.3);}
.phase-label{font-size:11px;color:var(--muted);margin-left:4px;}
.phase-sep{width:16px;height:1px;background:var(--border);}

/* PROGRESS */
.prog-wrap{margin-bottom:22px;}
.prog-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.prog-counter{font-size:12px;font-weight:700;color:var(--teal);letter-spacing:.1em;}
.prog-cat{font-size:11px;color:var(--teal);background:rgba(56,164,187,.15);border-radius:8px;padding:3px 10px;font-weight:500;}
.prog-track{height:4px;background:var(--bg);border-radius:4px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--yellow));border-radius:4px;transition:width .4s;}

/* SECTION HEADER */
.section-header{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;gap:12px;}
.section-icon{font-size:22px;}
.section-info{}
.section-title-sm{font-size:13px;font-weight:700;color:var(--text);margin-bottom:2px;}
.section-sub{font-size:11px;color:var(--muted);}

/* QUESTION */
.q-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:24px;margin-bottom:14px;}
.q-num{font-size:11px;font-weight:900;color:var(--teal);letter-spacing:.2em;text-transform:uppercase;margin-bottom:10px;}
.q-text{font-size:17px;font-weight:700;line-height:1.65;}
.options{display:flex;flex-direction:column;gap:10px;}
.opt-btn{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:15px 17px;text-align:left;color:var(--text);font-family:inherit;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:13px;line-height:1.55;transition:all .15s;}
.opt-btn:hover{border-color:var(--teal);background:rgba(56,164,187,.1);transform:translateX(4px);}
.opt-icon{width:33px;height:33px;min-width:33px;background:rgba(255,255,255,.05);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}

/* RESULT */
.res-hero{background:linear-gradient(135deg,rgba(56,164,187,.07),rgba(224,210,36,.04));border:1px solid var(--border);border-radius:22px;padding:28px 22px 24px;text-align:center;margin-bottom:12px;}
.personality-badge-wrap{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.personality-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 16px;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:.05em;}
.aptitude-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 16px;border-radius:20px;font-size:12px;font-weight:700;border:1px solid rgba(56,164,187,.4);color:var(--teal);background:rgba(56,164,187,.1);}
.type-code{font-size:44px;font-weight:900;font-family:system-ui;letter-spacing:.05em;margin-bottom:4px;}
.type-name-ja{font-size:16px;color:var(--muted);margin-bottom:14px;}
.res-emoji{font-size:48px;display:block;margin-bottom:10px;}
.res-main-title{font-size:22px;font-weight:900;margin-bottom:10px;}
.res-desc{font-size:13px;color:var(--muted);line-height:1.85;max-width:500px;margin:0 auto;}
.res-section{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px;margin-bottom:12px;}
.sec-title{font-size:11px;font-weight:700;color:var(--subtle);text-transform:uppercase;letter-spacing:.12em;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.sec-bar{width:3px;height:14px;border-radius:2px;display:inline-block;}
.traits{display:flex;flex-wrap:wrap;gap:8px;}
.trait{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:7px 13px;font-size:13px;display:flex;align-items:center;gap:6px;}
.axis-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.axis-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:14px;}
.axis-label{font-size:11px;color:var(--muted);margin-bottom:6px;}
.axis-track{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin-bottom:6px;}
.axis-fill{height:100%;border-radius:4px;transition:width 1s cubic-bezier(.4,0,.2,1);}
.axis-ends{display:flex;justify-content:space-between;font-size:10px;color:var(--subtle);}
.bar-row{margin-bottom:13px;}
.bar-label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;color:var(--muted);}
.bar-label strong{color:var(--text);}
.bar-track{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;}
.bar-fill{height:100%;border-radius:4px;width:0;transition:width 1s cubic-bezier(.4,0,.2,1);}
.jobs-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.job-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:13px 14px;}
.job-icon{font-size:20px;margin-bottom:5px;}
.job-name{font-size:13px;font-weight:700;margin-bottom:3px;color:#f3f4f6;}
.job-desc{font-size:11px;color:var(--subtle);line-height:1.5;}
.job-match{display:inline-block;font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;margin-bottom:5px;}
.advice-list{list-style:none;display:flex;flex-direction:column;gap:10px;}
.advice-item{display:flex;align-items:flex-start;gap:11px;font-size:13px;color:var(--muted);line-height:1.7;}
.advice-check{width:22px;height:22px;min-width:22px;background:rgba(67,233,123,.15);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#43e97b;margin-top:2px;}

/* SHARE */
.share-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.btn-url{background:linear-gradient(135deg,var(--teal),#2d8fa3);color:#fff;border:none;border-radius:14px;padding:14px 12px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s;box-shadow:0 4px 18px rgba(56,164,187,.3);}
.btn-url.copied{background:rgba(67,233,123,.15);color:#43e97b;box-shadow:none;border:1.5px solid #43e97b;}
.btn-img{background:linear-gradient(135deg,var(--yellow),#c8bc1a);color:var(--dark);border:none;border-radius:14px;padding:14px 12px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 18px rgba(224,210,36,.25);}
.btn-restart{width:100%;background:rgba(56,164,187,.07);border:1.5px solid var(--border);border-radius:14px;padding:15px;color:var(--teal);font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;margin-top:4px;}
.res-footer{text-align:center;margin-top:22px;padding-top:18px;border-top:1px solid var(--border);}
.res-footer-tagline{font-size:11px;color:#4a6470;letter-spacing:.05em;margin-top:6px;}
@media(max-width:480px){.jobs-grid,.axis-grid,.share-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <svg width="120" height="32" viewBox="0 0 120 32" fill="none">

  <div class="screen" id="screen-result">

      <div class="personality-badge-wrap">
        <span class="personality-badge" id="res-pers-badge"></span>

<script>
const BRAND={teal:"#38A4BB",yellow:"#E0D224",dark:"#253F48",bg:"#142028"};

// ============================================================
// PART 1: 適職診断 Q1-12
// ============================================================
const aptitudeQs = [
  {cat:"価値観",text:"仕事をするうえで一番大切にしたいことは？",opts:[
    {e:"🤝",l:"人に感謝されること・社会の役に立つこと",s:{social:3,creative:0,analytical:0,leadership:1}},

  {cat:"行動スタイル",text:"週末に時間が空いたとき、自然とやりたくなることは？",opts:[

    {e:"🎨",l:"絵を描く・音楽・写真など創作活動",s:{social:0,creative:3,analytical:0,leadership:0}},
    {e:"📚",l:"本を読む・ネットで調べ物をする",s:{social:0,creative:0,analytical:3,leadership:0}},
    {e:"⚡",l:"新しいことに挑戦・自己投資",s:{social:0,creative:1,analytical:1,leadership:3}}]},
  {cat:"得意なこと",text:"学校や職場で「得意だね」と言われやすかったことは？",opts:[
    {e:"👂",l:"人の話を聞いて共感・サポートする",s:{social:3,creative:0,analytical:0,leadership:1}},
    {e:"✏️",l:"企画・アイデア出し・デザイン",s:{social:0,creative:3,analytical:0,leadership:1}},
    {e:"🔍",l:"調査・分析・計算",s:{social:0,creative:0,analytical:3,leadership:0}},

    {e:"💨",l:"裁量が大きく、スピード感がある",s:{social:0,creative:1,analytical:0,leadership:3}}]},
  {cat:"モチベーション",text:"最もやる気が出るのはどんな瞬間？",opts:[
    {e:"🌟",l:"お客さんや同僚に感謝されたとき",s:{social:3,creative:0,analytical:0,leadership:1}},

    }
  };
  const aptMap = matrices[apt];
  if(aptMap[type]) return aptMap[type];
  // fallback: match by closest 2 letters
  const keys = Object.keys(aptMap).filter(k=>k!=="default");
  const best = keys.find(k=>k.split("").filter((c,i)=>c===type[i]).length>=2);
  return best ? aptMap[best] : aptMap.default;
}

function getAdvice(apt, type) {
  const E=type[0]==="E", N=type[1]==="N", T=type[2]==="T", J=type[3]==="J";
  const base = {
    social:["人を中心に置いた職種（採用・CS・営業・教育）は天職になりやすいです。","信頼関係の構築が得意なため、長期的な顧客・候補者対応で強みを発揮します。"],
    creative:["デザイン・マーケ・コンテンツなど、アウトプットが見える仕事が向いています。","スタートアップや制作会社では自分らしさを最大限に活かせます。"],
    analytical:["専門性を磨ける環境（エンジニア・データ・経営企画）が最適です。","スペシャリストとして評価され、その後マネジメントへ進む道もあります。"],
    leadership:["スピードと裁量がある環境（営業・ベンチャー・新規事業）が向いています。","早期にリーダーポジションを狙える企業・成長市場を選ぶのが正解です。"]
  };
  const personalityAdvice = [];
  if(E) personalityAdvice.push("外向型の強みを活かして、積極的なネットワーキングや対外交渉で価値を発揮できます。");
  else personalityAdvice.push("内向型の集中力と深い思考力を活かして、専門性・分析・執筆などで際立つことができます。");
  if(N) personalityAdvice.push("直感・未来志向の強みで、戦略立案や新しい概念の設計が得意分野になります。");
  else personalityAdvice.push("現実・実務の強みで、確実な実行力と精度の高い作業が高く評価されます。");
  if(J) personalityAdvice.push("計画性と実行力が高いため、プロジェクトリードやマネジメントへのキャリアが向いています。");
  else personalityAdvice.push("柔軟性と適応力が高いため、変化の早い環境やマルチタスクが必要な役割で輝けます。");
  return [...base[apt], ...personalityAdvice];
}

function renderQ(){
  const isPersonality = cur >= aptitudeQs.length;
  const localIdx = isPersonality ? cur - aptitudeQs.length : cur;
  const q = allQs[cur];
  const total = allQs.length;

  // Phase indicator
  document.getElementById('phase-apt').className = 'phase-dot' + (isPersonality ? ' done' : ' active');
  document.getElementById('phase-per').className = 'phase-dot' + (isPersonality ? ' active' : '');
  document.getElementById('phase-label-el').textContent = isPersonality ? '性格診断中' : '適職診断中';

  // Progress
  document.getElementById('prog-counter').textContent=`Q ${cur+1} / ${total}`;
  document.getElementById('prog-cat').textContent=q.cat;
  document.getElementById('q-num').textContent=`QUESTION ${String(cur+1).padStart(2,'0')}`;
  document.getElementById('q-text').textContent=q.text;
  document.getElementById('prog-fill').style.width=`${(cur/total)*100}%`;

  // Section header (show when switching to personality)
  const hw = document.getElementById('section-header-wrap');
  if(cur === aptitudeQs.length) {
    hw.innerHTML=`<div class="section-header"><div class="section-icon">🧠</div><div class="section-info"><div class="section-title-sm">パート2：性格タイプ診断</div><div class="section-sub">あなたの思考・判断・行動スタイルを分析します（16問）</div></div></div>`;
  } else if(cur===0){

  } else { hw.innerHTML=''; }

  // Options
  const el=document.getElementById('options');
  el.innerHTML=q.opts.map((o,i)=>`<button class="opt-btn" onclick="pick(${i})"><div class="opt-icon">${o.e}</div><span>${o.l}</span></button>`).join('');
}

function pick(i){
  const q=allQs[cur];
  if(cur < aptitudeQs.length){
    const s=q.opts[i].s;
    Object.keys(s).forEach(k=>aptScores[k]+=s[k]);
  } else {
    const o=q.opts[i];
    const w=o.weight||1;
    perScores[o.a]+=w; perScores[o.b]-=w;
  }
  cur++;
  if(cur>=allQs.length) calcResult();
  else renderQ();
}

function calcResult(){
  const topApt=Object.entries(aptScores).sort((a,b)=>b[1]-a[1])[0][0];
  const typeCode=[
    perScores.E>=perScores.I?'E':'I',
    perScores.N>=perScores.S?'N':'S',
    perScores.T>=perScores.F?'T':'F',
    perScores.J>=perScores.P?'J':'P'
  ].join('');
  currentApt=topApt; currentType=typeCode;
  showResult(topApt, typeCode);
  const url=new URL(location.href);
  url.searchParams.set('result',topApt);
  url.searchParams.set('type',typeCode);
  history.replaceState({},'',url);
}
